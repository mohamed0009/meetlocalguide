services:
  postgres:
    image: postgres:16-alpine
    container_name: meetlocalguide-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetlocalguide}
      POSTGRES_USER: ${POSTGRES_USER:-meetlocalguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetlocalguide}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetlocalguide} -d ${POSTGRES_DB:-meetlocalguide}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetlocalguide-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-meetlocalguide}
      DB_USERNAME: ${POSTGRES_USER:-meetlocalguide}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-meetlocalguide}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-meetlocalguide}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-bWVldGxvY2FsZ3VpZGUtZGV2LXN1cGVyLXNlY3JldC0zMmJ5dGVzLW1pbmltdW0=}
      APP_CORS_ALLOWED_ORIGIN_PRIMARY: ${APP_CORS_ALLOWED_ORIGIN_PRIMARY:-http://localhost:3000}
      APP_CORS_ALLOWED_ORIGIN_SECONDARY: ${APP_CORS_ALLOWED_ORIGIN_SECONDARY:-https://meetlocalguide.com}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meetlocalguide-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
