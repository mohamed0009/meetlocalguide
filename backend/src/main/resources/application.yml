spring:
  application:
    name: meetlocalguide-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    rate-limit:
      auth-requests-per-minute: ${APP_AUTH_RATE_LIMIT_PER_MINUTE:30}
