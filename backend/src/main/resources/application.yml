spring:
  application:
    name: meetlocalguide-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cache:
    type: simple
  task:
    execution:
      thread-name-prefix: mlg-async-
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:${spring.profiles.default:dev}}

info:
  app:
    name: ${spring.application.name}
    description: MeetLocalGuide backend API
    version: ${APP_VERSION:dev}

app:
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:https://meetlocalguide.com}
  security:
    require-https: ${APP_SECURITY_REQUIRE_HTTPS:false}
    rate-limit:
      auth-requests-per-minute: ${APP_AUTH_RATE_LIMIT_PER_MINUTE:30}
